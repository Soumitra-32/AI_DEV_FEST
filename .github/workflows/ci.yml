# CI: verify every push/PR. Fast by design — no live LLM keys exist here,
# so the suite runs the deterministic template path (~minutes, not hours).
name: CI

on:
  push:
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      # Several tests read the real database path (test_signal, test_rag via
      # default_db_path), which is gitignored and absent in CI. Generate it
      # first; the small_db fixture covers the rest.
      - run: python backend/scripts/generate_data.py
      - run: python -m pytest backend/tests -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    needs: [backend-test]
    env:
      DEMO_AUTH_TOKEN: ci-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python backend/scripts/generate_data.py
      - run: nohup python -m uvicorn backend.app.main:app --port 8000 >/tmp/uvicorn.log 2>&1 &
      - run: sleep 8
      - run: curl -sf http://localhost:8000/health
      - run: >
          curl -sf -H "X-Demo-Token: ci-token"
          http://localhost:8000/me
      - run: curl -sf http://localhost:8000/metrics
      - run: >
          curl -sf -X POST http://localhost:8000/parse-goal
          -H "Content-Type: application/json"
          -d '{"message": "save 30000 in 6 months"}'

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t shonchoy-api:ci .
      - run: docker run -d --name shonchoy-ci -p 8000:8000 shonchoy-api:ci
      - run: sleep 100; curl -sf http://localhost:8000/health
      - run: docker stop shonchoy-ci
        if: always()
