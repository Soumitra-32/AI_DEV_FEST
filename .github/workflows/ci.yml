# CI: verify every push/PR. Fast by design — no live LLM keys exist here,
# so the suite runs the deterministic template path (~minutes, not hours).
name: CI

on:
  push:
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    env:
      # No .env in CI: importing backend.app.main runs the boot guard, which
      # refuses placeholder tokens. Tests use explicit tokens throughout.
      ALLOW_DEFAULT_TOKEN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      # The GAP-01 acceptance test reads the full generated dataset
      # (deterministic seeds: identical everywhere), so generate it first;
      # every other test is hermetic on tmp fixtures.
      - run: python backend/scripts/generate_data.py
      - run: python -m pytest backend/tests -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    needs: [backend-test]
    env:
      DEMO_AUTH_TOKEN: ci-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python backend/scripts/generate_data.py
      - run: nohup python -m uvicorn backend.app.main:app --port 8000 >/tmp/uvicorn.log 2>&1 &
      - run: |
          for i in $(seq 1 24); do
            if curl -sf http://localhost:8000/health; then
              echo "API healthy after ~$((i * 5))s"
              exit 0
            fi
            echo "Attempt $i: not ready yet, waiting 5s..."
            sleep 5
          done
          echo "API never became healthy; uvicorn log:"
          cat /tmp/uvicorn.log
          exit 1
      - run: >
          curl -sf -H "X-Demo-Token: ci-token"
          http://localhost:8000/me
      - run: >
          curl -sf -H "X-Demo-Token: ci-token"
          http://localhost:8000/metrics
      - run: >
          curl -sf -X POST http://localhost:8000/parse-goal
          -H "Content-Type: application/json"
          -d '{"message": "save 30000 in 6 months"}'

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t shonchoy-api:ci .
      # A real token (never the placeholder): also exercises the boot guard,
      # which must refuse to start on "change-me".
      - run: docker run -d --name shonchoy-ci -p 8000:8000 -e DEMO_AUTH_TOKEN=ci-docker-token shonchoy-api:ci
      # First boot generates the synthetic DB inside the container, so poll
      # instead of sleeping a fixed 100s; dump logs when it never turns green.
      - run: |
          for i in $(seq 1 36); do
            if curl -sf http://localhost:8000/health; then
              echo "API healthy after ~$((i * 5))s"
              exit 0
            fi
            echo "Attempt $i: not ready yet, waiting 5s..."
            sleep 5
          done
          echo "API never became healthy; container logs:"
          docker logs shonchoy-ci
          exit 1
      - run: docker stop shonchoy-ci
        if: always()
