# ============================================================
# Shonchoy Copilot — synthetic data pipeline configuration
#
# Every value here is SIMULATED. Fee rates are assumed for the
# simulation and are NOT official upay pricing.
# Rationale for each assumption: docs/DATA_ASSUMPTIONS.md
# ============================================================

meta:
  generator_version: "1.0.0"

seeds:
  train: 42          # cohort used for the train + validation users
  test: 1337         # separately seeded cohort held out for testing
  split: 7           # user-level train/val split of the training cohort
  demo: 2026         # demo user "Rahim"
  anomaly: 99        # anomaly injection
  label: 555         # stability label generation

dataset:
  n_users: 500
  months: 6
  start_date: "2025-01-01"
  database: "backend/data/shonchoy.db"
  currency: "BDT"
  active_hours: [6, 23]      # normal transaction window (inclusive start)
  round_to_bdt: 10           # amounts are rounded to the nearest 10 taka
  start_balance_days: 7.0    # opening balance = this many days of expected income
  weekend_weekdays: [4, 5]   # Friday, Saturday (Bangladesh weekend)
  # share of monthly income a user manages to keep; the rest is spent or cashed out
  savings_rate: {mean: 0.06, std: 0.06, min: 0.0, max: 0.18}
  # users under month-end pressure barely save, so their balance hovers near zero
  pressure_savings_penalty: 0.4

split:
  # Proportions of dataset.n_users. The test share is generated from the
  # separately seeded cohort; train/val come from the training cohort.
  train: 0.70
  val: 0.15
  test: 0.15

fee_rates:
  note: "assumed for simulation, not official upay pricing"
  by_channel:
    cash_out: 1.85
    bangla_qr: 0.0
    app_transfer: 0.0
    merchant_payment: 0.0
    send_money: 0.0
    bill_payment: 0.0
    mobile_topup: 0.0
    agent_deposit: 0.0
  flat_bdt:
    cash_out: 0.0
  min_fee_bdt: 0.0

income_bands:
  low:  {weight: 0.40, income_multiplier: 0.75}
  mid:  {weight: 0.40, income_multiplier: 1.00}
  high: {weight: 0.20, income_multiplier: 1.35}

age_bands:
  "18-24": 0.18
  "25-34": 0.32
  "35-44": 0.26
  "45-54": 0.16
  "55-64": 0.08

language_pref:
  bn: 0.90
  en: 0.10

# Category -> transaction type / channel mapping used by the generator.
income_categories: [wage, sales, salary, remittance, gig_payout]
channel_by_category:
  wage: agent_deposit
  sales: agent_deposit
  salary: agent_deposit
  remittance: agent_deposit
  gig_payout: agent_deposit
  food: merchant_payment
  transport: merchant_payment
  utilities: bill_payment
  mobile_topup: mobile_topup
  family_transfer: send_money
  cash_out: cash_out

# ------------------------------------------------------------
# Personas (documented in docs/DATA_ASSUMPTIONS.md §2)
# ------------------------------------------------------------
personas:
  daily_wage:
    name_en: "Daily wage earner"
    name_bn: "দৈনিক আয়কারী"
    income:
      style: irregular_daily
      days_per_week: 5.0
      mean_bdt: 900
      std_bdt: 280
    spend:
      daily_mean_bdt: 330
      daily_std_bdt: 120
      categories: [food, transport, utilities, mobile_topup, family_transfer]
    bills: {count_per_month: 2, mean_bdt: 700, std_bdt: 250}
    cash_out: {lumps_per_month: 3, size_std_ratio: 0.35, month_end_share: 0.25, min_lump_bdt: 100}

  shopkeeper:
    name_en: "Small shopkeeper"
    name_bn: "ছোট দোকানদার"
    income:
      style: merchant_daily
      days_per_week: 7.0
      mean_bdt: 1400
      std_bdt: 420
      weekend_peak_multiplier: 1.6
    spend:
      daily_mean_bdt: 700
      daily_std_bdt: 240
      categories: [food, transport, utilities, mobile_topup, family_transfer]
    bills: {count_per_month: 3, mean_bdt: 1100, std_bdt: 350}
    cash_out: {lumps_per_month: 4, size_std_ratio: 0.35, month_end_share: 0.25, min_lump_bdt: 100}

  salaried:
    name_en: "Salaried worker"
    name_bn: "চাকরিজীবী"
    income:
      style: monthly_fixed
      salary_day: first      # first | last day of the month
      mean_bdt: 30000
      std_bdt: 3000
    spend:
      daily_mean_bdt: 500
      daily_std_bdt: 180
      categories: [food, transport, utilities, mobile_topup, family_transfer]
    bills: {count_per_month: 3, mean_bdt: 1500, std_bdt: 400}
    cash_out: {lumps_per_month: 3, size_std_ratio: 0.35, month_end_share: 0.20, min_lump_bdt: 100}

  student:
    name_en: "Student (family remittance)"
    name_bn: "শিক্ষার্থী"
    income:
      style: periodic
      every_n_days: 30
      mean_bdt: 8000
      std_bdt: 1200
    spend:
      daily_mean_bdt: 175
      daily_std_bdt: 70
      categories: [food, transport, mobile_topup]
    bills: {count_per_month: 1, mean_bdt: 300, std_bdt: 100}
    cash_out: {lumps_per_month: 1, size_std_ratio: 0.35, month_end_share: 0.20, min_lump_bdt: 100}

  gig_rider:
    name_en: "Gig / delivery rider"
    name_bn: "গিগ রাইডার"
    income:
      style: weekly
      payout_weekday: 5      # 0=Monday ... 5=Saturday
      mean_bdt: 5600
      std_bdt: 900
    spend:
      daily_mean_bdt: 400
      daily_std_bdt: 140
      categories: [food, transport, utilities, mobile_topup, family_transfer]
    bills: {count_per_month: 2, mean_bdt: 800, std_bdt: 250}
    cash_out: {lumps_per_month: 4, size_std_ratio: 0.35, month_end_share: 0.25, min_lump_bdt: 100}

  remittance_receiver:
    name_en: "Remittance receiver"
    name_bn: "রেমিট্যান্স গ্রহীতা"
    income:
      style: periodic
      every_n_days: 30
      mean_bdt: 42000
      std_bdt: 9000
    spend:
      daily_mean_bdt: 600
      daily_std_bdt: 220
      categories: [food, transport, utilities, mobile_topup, family_transfer]
    bills: {count_per_month: 3, mean_bdt: 1400, std_bdt: 400}
    cash_out: {lumps_per_month: 5, size_std_ratio: 0.35, month_end_share: 0.25, min_lump_bdt: 100}

# ------------------------------------------------------------
# Month-end pressure (docs/DATA_ASSUMPTIONS.md §4)
# ------------------------------------------------------------
month_end_pressure:
  applies_prob: 0.55
  intensity_mean: 0.45
  intensity_std: 0.18
  spike_days: 4
  personas: [daily_wage, shopkeeper, salaried, gig_rider]

# ------------------------------------------------------------
# Injected anomalies (docs/DATA_ASSUMPTIONS.md §5)
# ------------------------------------------------------------
anomalies:
  rate: 0.02
  types:
    unusually_large: 0.45
    unusual_time: 0.35
    rapid_repeat: 0.20
  unusually_large_multiplier: 4.0
  unusual_time_hours: [0, 1, 2, 3, 4]
  rapid_repeat: {count: 3, window_minutes: 20}

# ------------------------------------------------------------
# Stability label (docs/DATA_ASSUMPTIONS.md §8)
# ------------------------------------------------------------
stability_label:
  latent_mean: 0.0
  latent_std: 1.0
  noise_std: 0.55
  shock_prob: 0.15
  shock_mean: -0.6
  shock_std: 0.4
  threshold: 0.0
  horizon_months: 2
  # weak, deliberate influence of the latent variable on behaviour, so the
  # task is learnable but never circular
  behaviour_influence: 0.25

# ------------------------------------------------------------
# Districts and persona mixes (docs/DATA_ASSUMPTIONS.md §7)
# ------------------------------------------------------------
districts:
  - {name: Dhaka, name_bn: ঢাকা, type: metro, population_weight: 3.0}
  - {name: Chattogram, name_bn: চট্টগ্রাম, type: metro, population_weight: 2.2}
  - {name: Sylhet, name_bn: সিলেট, type: metro, population_weight: 1.2}
  - {name: Khulna, name_bn: খুলনা, type: urban, population_weight: 1.0}
  - {name: Rajshahi, name_bn: রাজশাহী, type: urban, population_weight: 1.0}
  - {name: Barishal, name_bn: বরিশাল, type: urban, population_weight: 0.8}
  - {name: Cumilla, name_bn: কুমিল্লা, type: urban, population_weight: 0.9}
  - {name: Mymensingh, name_bn: ময়মনসিংহ, type: urban, population_weight: 0.8}
  - {name: Rangpur, name_bn: রংপুর, type: rural, population_weight: 1.1}
  - {name: "Cox's Bazar", name_bn: কক্সবাজার, type: rural, population_weight: 0.7}

district_persona_mix:
  metro:
    daily_wage: 0.18
    shopkeeper: 0.20
    salaried: 0.28
    student: 0.12
    gig_rider: 0.14
    remittance_receiver: 0.08
  urban:
    daily_wage: 0.24
    shopkeeper: 0.24
    salaried: 0.20
    student: 0.13
    gig_rider: 0.11
    remittance_receiver: 0.08
  rural:
    daily_wage: 0.34
    shopkeeper: 0.22
    salaried: 0.12
    student: 0.11
    gig_rider: 0.05
    remittance_receiver: 0.16

# ------------------------------------------------------------
# Demo user "Rahim" (docs/DATA_ASSUMPTIONS.md §11)
# 5 cash-outs x 3500 = 17,500/month -> 1.85% = 323.75 fee (~320)
# ------------------------------------------------------------
demo_user:
  user_id: rahim
  name_en: "Rahim"
  name_bn: "রহিম"
  persona: daily_wage
  district: Dhaka
  income_band: mid
  age_band: "25-34"
  language_pref: bn
  months: 6
  seed: 2026
  # Rahim keeps about a fifth of his income aside, which is exactly why the demo's
  # ৳5,000/month goal is feasible; the rest is spent or cashed out (5 x ~৳3,500).
  savings_rate: 0.20
  income:
    style: irregular_daily
    days_per_week: 6.0
    mean_bdt: 1750
    std_bdt: 250
  spend:
    daily_mean_bdt: 550
    daily_std_bdt: 180
    categories: [food, transport, utilities, mobile_topup, family_transfer]
  bills: {count_per_month: 2, mean_bdt: 750, std_bdt: 150}
  cash_out: {lumps_per_month: 5, size_std_ratio: 0.10, month_end_share: 0.40, min_lump_bdt: 100}
  month_end_pressure: {applies_prob: 1.0, intensity_mean: 0.60, intensity_std: 0.0, spike_days: 4}
  expected_monthly_cash_out_bdt: 17500
  expected_monthly_fee_bdt: 323.75
  goal:
    target_bdt: 30000
    months: 6
  goal_label_bn: "৬ মাসে ৳৩০,০০০ জমাতে চাই"
  goal_label_en: "I want to save 30,000 taka in 6 months"



