services:
  - type: web
    name: shonchoy-copilot-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && python backend/scripts/generate_data.py && python backend/scripts/seed_demo_user.py"
    startCommand: "python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEMO_AUTH_TOKEN
        # Never commit a real token: set the value in the Render dashboard
        # and mirror the same value in Vercel as NEXT_DEMO_TOKEN (or
        # NEXT_PUBLIC_DEMO_TOKEN, whichever the frontend code reads).
        # sync:false keeps dashboard edits from being overwritten by deploys.
        sync: false
      - key: CORS_ORIGINS
        # IMPORTANT: no trailing slash on any origin. Browsers send the
        # Origin header without a trailing slash, so a trailing slash here
        # causes every preflight/request to fail CORS.
        value: "http://localhost:3000,http://127.0.0.1:3000,https://shonchoy-copilot.vercel.app"
      - key: DATABASE_PATH
        value: "backend/data/shonchoy.db"
      - key: FEATURE_VOICE
        value: "true"
      - key: FEATURE_SIGNAL
        value: "true"
      - key: FEATURE_TIPS
        value: "true"
      - key: FEATURE_METRICS
        value: "true"
      - key: FEATURE_LLM_INTENT
        value: "true"
